spring.application.name=seatflow-backend

server.port=${SERVER_PORT:18080}

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:seatflow}
spring.datasource.username=${POSTGRES_USER:seatflow}
spring.datasource.password=${POSTGRES_PASSWORD:seatflow_local_password}

spring.flyway.default-schema=public

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=seatflow